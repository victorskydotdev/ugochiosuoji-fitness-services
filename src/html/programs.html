<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- font awesome -->
		<script
			src="https://kit.fontawesome.com/8464da9b67.js"
			crossorigin="anonymous"></script>

		<!-- Google tag (gtag.js) -->
		<script
			async
			src="https://www.googletagmanager.com/gtag/js?id=G-N6NWSH1Y43"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());

			gtag('config', 'G-N6NWSH1Y43');
		</script>

		<!-- page title -->
		<title>Ugochi Osuoji Fitness Services | Services</title>
	</head>
	<body class="body">
		<header class="header"></header>

		<!-- book now form modal -->
		<div class="book-now-modal"></div>
		<!-- end of book now form modal -->

		<main class="services-main">
			<div class="container">
				<div class="heading-wrap">
					<h1 class="heading">Work with me. Become your best self</h1>

					<p class="subtext">
						We’ve come a long way, learn about journey and impact we’ve had with
						women, over the years
					</p>
				</div>

				<img src="../media/rotate-elem.svg" alt="" class="rotating-img" />
			</div>
		</main>

		<div class="our-programs-section">
			<div class="container">
				<div class="heading-wrap">
					<h3 class="heading">Our programs</h3>

					<p class="subtext">
						We’ve come a long way, learn about journey and impact we’ve had with
						women, over the years
					</p>
				</div>

				<div class="programs-card">
					<!-- one on one section -->
					<div class="card product-card" data-tag-id="oneOneProgramTag"></div>

					<!-- group section -->
					<div class="card product-card" data-tag-id="groupProgramTag"></div>

					<!-- non-categorized section -->
					<div class="card product-card" data-tag-id="nonCategorizedTag"></div>

					<!-- nutrition guide section -->

					<div class="card">
						<div class="text-wrap">
							<h3 class="heading">My nutritional guide</h3>
							<!-- <p class="subtext">
								Lorem ipsum dolor sit amet, consectetur adipisicing elit.
								Minima, dolor.
							</p> -->
						</div>

						<div
							class="product-card nutri-product-wrap"
							data-tag-id="nutriGuideTag"></div>
					</div>
				</div>
			</div>
		</div>

		<!-- payment form modal -->
		<div class="payment-form-modal">
			<div class="container">
				<div class="wrap">
					<div class="form-masthead">
						<h3 class="heading">Program Order Form</h3>
					</div>

					<form name="payment-form" class="payment-form">
						<div class="input-group">
							<label for="name" class="label">Name</label>
							<input
								type="text"
								name="name"
								id="name"
								class="input-field"
								placeholder="Enter your name"
								required />
						</div>

						<div class="input-group">
							<label for="email" class="label">Email</label>
							<input
								type="email"
								name="email"
								id="email"
								class="input-field"
								placeholder="Enter your email"
								required />
						</div>

						<div class="input-group">
							<label for="message" class="label">Message</label>
							<textarea
								name="message"
								id="message"
								class="input-field textarea-field"
								placeholder="Write your message here..."
								rows="5"
								required></textarea>
						</div>

						<div class="btn-wrap payment-btn-wrap">
							<button type="submit" class="btn payment-submit-btn submit-btn">
								Proceed to payment
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		<!-- end of payment modal -->

		<!-- learn more modal -->
		<div class="learn-more-modal"></div>

		<footer class="footer"></footer>

		<script src="https://js.paystack.co/v1/inline.js"></script>
	</body>
</html>
